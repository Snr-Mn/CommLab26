<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling</title>
    <link rel="stylesheet" href="../js/falling.css">
    <script src="../js/falling.js" defer></script>
</head>

<body>
    <img class="cursor" src="../img/cursor.png" height="32" />
    <div class="orbit">
        <div class="cat">
            <img src="../img/cat.png" width="200px" height="320" />
        </div>
        <div class="catSpeak">
            <img class="speechBubble" src="../img/speech.png" width="250" />
            <p class="catText"></p>
        </div>
    </div>

    <div class="catStandWrapper">
        <img class="catStand" src="../img/cat.png" height="250px" />
        <div class="catStandSpeak">
            <img class="speechBubble" src="../img/speech.png" width="250" />
            <div class="catStandText"></div>
        </div>
    </div>

    <div class="layerWrapper">
        <div class="circleLayer" data-depth="1"></div>
        <div class="circleLayer" data-depth="2"></div>
        <div class="circleLayer" data-depth="3"></div>
        <div class="circleLayer" data-depth="4"></div>
        <div class="circleLayer" data-depth="5"></div>
        <div class="circleLayer" data-depth="6"></div>
        <div class="circleLayer" data-depth="7"></div>
        <div class="circleLayer" data-depth="8"></div>
        <div class="circleLayer" data-depth="9"></div>
    </div>

    <div class="nextLocation">
        <img class='table' src="../img/table.png" width="400px" />
        <img class="cake" src="../img/cake.png" height="100px" />
        <img class="water" src="../img/water.png" height="100px" />
        <img class="hole" src="../img/door.png" height="50px" />
    </div>
    <img class="background" src="../img/dirt.jpg" width="100%" height="100%" />
</body>

</html>
