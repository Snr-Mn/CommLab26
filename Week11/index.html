<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equation Clock</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="calculator">
        <div class="label">Hours</div>
        <div class="showCalc" id="hourCalc">...</div>
        <div class="buttons">
            <div class="row"><button>7</button><button>8</button><button>9</button></div>
            <div class="row"><button>4</button><button>5</button><button>6</button></div>
            <div class="row"><button>1</button><button>2</button><button>3</button></div>
            <div class="row"><button>(</button><button>0</button><button>)</button></div>
            <div class="row"><button>+</button><button>-</button><button>×</button></div>
            <div class="row"><button class="equals">= </button></div>
        </div>
    </div>

    <div class="calculator">
        <div class="label">Minutes</div>
        <div class="showCalc" id="minCalc">...</div>
        <div class="buttons">
            <div class="row"><button>7</button><button>8</button><button>9</button></div>
            <div class="row"><button>4</button><button>5</button><button>6</button></div>
            <div class="row"><button>1</button><button>2</button><button>3</button></div>
            <div class="row"><button>(</button><button>0</button><button>)</button></div>
            <div class="row"><button>+</button><button>-</button><button>×</button></div>
            <div class="row"><button class="equals">= </button></div>
        </div>
    </div>

    <div class="calculator">
        <div class="label">Seconds</div>
        <div class="showCalc" id="secCalc">...</div>
        <div class="buttons">
            <div class="row"><button>7</button><button>8</button><button>9</button></div>
            <div class="row"><button>4</button><button>5</button><button>6</button></div>
            <div class="row"><button>1</button><button>2</button><button>3</button></div>
            <div class="row"><button>(</button><button>0</button><button>)</button></div>
            <div class="row"><button>+</button><button>-</button><button>×</button></div>
            <div class="row"><button class="equals">= </button></div>
        </div>
    </div>
</body>

</html>
